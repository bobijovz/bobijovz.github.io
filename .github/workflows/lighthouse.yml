name: Lighthouse CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ master ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          npm run build --if-present
          npm run export --if-present

      - name: Run LHCI autorun
        run: |
          npx lhci autorun --config=./lighthouseci/lhci.yml
